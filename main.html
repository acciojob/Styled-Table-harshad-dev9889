<!DOCTYPE html>
<html>
<head>
    <title>Student Statistics</title>

    <style>
        table {
            width: 70%;
            border-collapse: collapse;
            margin: 30px auto;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #ddd;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Student Result Statistics</h1>

    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Maths</th>
                <th>Science</th>
                <th>English</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Harshad</td>
                <td>85</td>
                <td>90</td>
                <td>88</td>
                <td>263</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>78</td>
                <td>82</td>
                <td>80</td>
                <td>240</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>92</td>
                <td>89</td>
                <td>95</td>
                <td>276</td>
            </tr>

            <tr>
                <td>Neha</td>
                <td>88</td>
                <td>84</td>
                <td>91</td>
                <td>263</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
